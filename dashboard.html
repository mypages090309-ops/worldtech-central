<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - WorldTech</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

<!-- ✅ PARTICLES -->
<div id="particles-js"></div>

<div class="dashboard">

  <!-- HEADER -->
  <div class="header">
    <h2>WorldTech Dashboard</h2>
    <button onclick="logout()">Logout</button>
  </div>

  <!-- USER INFO -->
  <div class="card">
    <h3>Welcome, <span id="username"></span> 👋</h3>
    <p><strong>Name:</strong> <span id="name"></span></p>
    <p><strong>Course:</strong> <span id="course"></span></p>
  </div>

</div>

<!-- ✅ PARTICLES SCRIPT -->
<script src="https://cdn.jsdelivr.net/npm/particles.js"></script>

<script>
particlesJS("particles-js", {
  particles: {
    number: { value: 60 },
    size: { value: 3 },
    move: { speed: 1 },
    line_linked: {
      enable: true,
      distance: 150,
      color: "#38bdf8",
      opacity: 0.4
    }
  }
});
</script>

<script src="dashboard.js"></script>
</body>
</html>
